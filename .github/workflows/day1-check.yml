name: Day 1 Check

on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Debug — list files
        run: |
          echo "=== Repo tree ==="
          ls -la
          echo "--- docs ---"
          ls -la docs || echo "no docs dir"

      - name: Check required files
        run: |
          set +e
          FAIL=0
          for f in README.md docs/analysis.md docs/requirements.md docs/tz.md docs/stakeholders.md; do
            if [ ! -f "$f" ]; then
              echo "FAIL: $f not found"; FAIL=1; continue
            fi
            SIZE=$(wc -c < "$f" | tr -d ' ')
            echo "INFO: $f size=$SIZE"
            if [ "$SIZE" -lt 500 ]; then
              echo "FAIL: $f too small ($SIZE < 500)"; FAIL=1
            fi
          done
          [ "$FAIL" -eq 0 ] && echo "PASS: files OK" || exit 1

      - name: Check User Stories
        run: |
          set +e
          COUNT=$(grep -c "Как " docs/requirements.md 2>/dev/null)
          [ -z "$COUNT" ] && COUNT=0
          echo "User Stories found: $COUNT"
          [ "$COUNT" -ge 10 ] || { echo "FAIL: need >= 10"; exit 1; }
          echo "PASS: User Stories OK"

      - name: Check NFR
        run: |
          set +e
          COUNT=$(grep -c "NFR-" docs/requirements.md 2>/dev/null)
          [ -z "$COUNT" ] && COUNT=0
          echo "NFR found: $COUNT"
          [ "$COUNT" -ge 5 ] || { echo "FAIL: need >= 5"; exit 1; }
          echo "PASS: NFR OK"

      - name: Check TZ sections
        run: |
          set +e
          FAIL=0
          for section in "Назначение" "предметной области" "функци" "качеств" "интерфей" "данны" "стек" "Ограничен"; do
            if grep -qi "$section" docs/tz.md; then
              echo "PASS: '$section'"
            else
              echo "FAIL: '$section' not found"; FAIL=1
            fi
          done
          [ "$FAIL" -eq 0 ] || exit 1

      - name: Check entities
        run: |
          set +e
          COUNT=$(grep -c "|" docs/analysis.md 2>/dev/null)
          [ -z "$COUNT" ] && COUNT=0
          echo "Entities found: $COUNT"
          [ "$COUNT" -ge 10 ] || { echo "FAIL: need >= 10"; exit 1; }
          echo "PASS: Entities OK"

      - name: All checks passed
        run: echo "ALL CHECKS PASSED"
